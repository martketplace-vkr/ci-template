name: Deploy microservice

on:
  workflow_call:
    inputs:
      service_name:
        required: true
        type: string
      values_file:
        required: true
        type: string
      namespace:
        required: true
        type: string
    secrets:
      DOCKER_USERNAME:
        required: true
      DOCKER_PASSWORD:
        required: true
      KUBE_CONFIG:
        required: true

jobs:

  deploy:
    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          logout: false

      - name: Build image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/${{ inputs.service_name }}:${{ github.sha }} .

      - name: Push image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/${{ inputs.service_name }}:${{ github.sha }}

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Setup kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" > ~/.kube/config
      
      - name: Checkout Helm chart
        uses: actions/checkout@v4
        with:
          repository: martketplace-vkr/ci-template
          path: .

      - name: Deploy
        run: |
          helm upgrade --install \
          ${{ inputs.service_name }} \
          ./helm/microservice \
          -f $GITHUB_WORKSPACE/.deploy/values.yaml \
          --set image.tag=${{ github.sha }} \
          --namespace ${{ inputs.namespace }} \
          --create-namespace